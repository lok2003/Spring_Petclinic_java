name: maven build workflow
on:
  workflow_dispatch:
  push:
    branches: '*'
jobs:
  maven_build:
    runs-on: ubuntu-latest
    if: ${{github.ref_name=='main'}}
    steps:
      - name: checkout repo branch
        uses: actions/checkout@v4
      - name: install java and maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build maven package
        run:  mvn clean package
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spring-jar
          path: target/*.jar
          retention-days: 90
  build_image:
     needs: maven_build
     runs-on: ubuntu-latest
     steps:
       - name: checkout repo branch
         uses: actions/checkout@v4
       - name: install docker
         uses: docker/setup-buildx-action@v4
       - name: Login to docker hub
         uses: docker/login-action@v4
         with: 
           username:${{secrets.DOCKERHUB_NAME}}
           password:${{secrets.DOCKERHUB_USER}}
       - name: build jar with maven
         run: ./mvnw clean package -DskipTests
       - name: find Dockerfile
         run: find . iname "dockerfile*"
       - name: list files
         run:  ls-la
       - name: build spring application
         run: docker image build -t alammanoj/spring-boot:1.0.0 .
       - name: Build and push Docker Image
         uses: docker/build-push-action@v4
         with:
           context: .
           push: true
           tags: ${{secrets.DOCKERHUB_NAME}}/spring-boot:1.0.0